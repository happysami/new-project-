<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory History | Store Management System</title>
    <link rel="stylesheet" href="../../css/main.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <h2>StoreFlow</h2>
        <nav>
          <a href="../../dashboard.html">Dashboard</a>
          <a href="inventory.html">Inventory</a>
          <a href="inventory-history.html" class="active">Inventory History</a>
          <a href="../sales/sales.html">Sales</a>
          <a href="../payments/payments.html">Payments</a>
          <a href="../customers/customers.html">Customers</a>
          <a href="../suppliers/suppliers.html">Suppliers</a>
          <a href="../van-sales/van-sales.html">Van Sales</a>
          <a href="../reports/reports.html">Reports</a>
        </nav>
      </aside>
      <main class="page-content">
        <header class="topbar">
          <h1>Inventory History</h1>
          <a href="inventory.html">Back</a>
        </header>

        <section class="panel">
          <!-- Control Bar -->
          <div class="control-bar">
            <div class="control-bar-left">
              <!-- Quick Date Filters -->
              <div class="quick-filters">
                <button class="quick-filter-btn active" data-range="today">Today</button>
                <button class="quick-filter-btn" data-range="yesterday">Yesterday</button>
                <button class="quick-filter-btn" data-range="this-week">This Week</button>
                <button class="quick-filter-btn" data-range="this-month">This Month</button>
              </div>
            </div>

            <div class="control-bar-right">
              <!-- Custom Date Picker -->
              <div class="date-picker-wrapper">
                <input type="text" id="customDateRange" class="date-input" placeholder="Select custom date range" readonly />
                <svg class="date-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </div>

              <!-- Store Filter -->
              <div class="filter-dropdown">
                <select id="storeFilter" class="filter-select">
                  <option value="">All Stores</option>
                  <option value="store-1">Downtown Store</option>
                  <option value="store-2">Mall Branch</option>
                  <option value="store-3">Airport Location</option>
                </select>
              </div>

              <!-- Employee Filter -->
              <div class="filter-dropdown">
                <select id="employeeFilter" class="filter-select">
                  <option value="">All Employees</option>
                  <option value="emp-1">John Smith</option>
                  <option value="emp-2">Sarah Johnson</option>
                  <option value="emp-3">Mike Williams</option>
                  <option value="emp-4">Emily Davis</option>
                </select>
              </div>

              <!-- Adjustment Reason Filter -->
              <div class="filter-dropdown">
                <select id="reasonFilter" class="filter-select">
                  <option value="">All Reasons</option>
                  <option value="stock-in">Stock In</option>
                  <option value="stock-out">Stock Out</option>
                  <option value="damaged">Damaged</option>
                  <option value="expired">Expired</option>
                  <option value="correction">Correction</option>
                  <option value="return">Return</option>
                  <option value="theft">Theft/Loss</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Search Bar -->
          <div class="table-controls">
            <div class="search-wrapper">
              <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="searchInput" class="search-input" placeholder="Search by item name, employee, or reason..." />
            </div>
            <div class="table-info">
              <span id="resultCount">Showing 0 results</span>
            </div>
          </div>

          <!-- Data Table -->
          <div class="table-wrapper">
            <table class="data-table" id="inventoryHistoryTable">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Item Name</th>
                  <th>Store Location</th>
                  <th>Responsible Employee</th>
                  <th>Reason for Change</th>
                  <th class="text-center">Adjustment Quantity</th>
                  <th class="text-right">Final Stock Count</th>
                </tr>
              </thead>
              <tbody id="inventoryHistoryBody">
                <!-- Sample data will be loaded here -->
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="pagination">
            <button class="pagination-btn" id="prevPage" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
              Previous
            </button>
            <span class="pagination-info">Page <span id="currentPage">1</span> of <span id="totalPages">1</span></span>
            <button class="pagination-btn" id="nextPage" disabled>
              Next
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="../../js/inventory/inventory-history.js"></script>
  </body>
</html>
