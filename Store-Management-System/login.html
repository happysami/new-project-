<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Store Management System</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-card">
        <h1>StoreFlow ERP</h1>
        <p>Sign in to access your store operations</p>
        <form id="loginForm">
          <input type="email" id="email" placeholder="Email" value="admin@storeflow.com" required />
          <input type="password" id="password" placeholder="Password" value="admin123" required />
          <button type="submit">Login</button>
        </form>
      </section>
    </main>
    <script src="js/auth/login.js"></script>
  </body>
</html>
